# air（ホットリロード）の設定。
# ソースはバインドマウントされているので、保存すると自動で再ビルド・再起動する。

root = "."
tmp_dir = "tmp"

[build]
  # 開発ビルドは dev_auth タグ付き。AUTH_MODE=dev を使えるようにするため。
  # 本番イメージ（Dockerfile）はこのタグを付けない（LOCAL_DEV.md §5.4）。
  cmd = "go build -tags dev_auth -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "toml"]
  # core を replace で参照しているため、core 側の変更も監視対象にする。
  include_dir = ["cmd", "internal"]
  exclude_dir = ["tmp", "bin"]
  delay = 300
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
